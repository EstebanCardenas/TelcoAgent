services:
  agente:
    image: estebancardenas/telco:2026-20
    container_name: telco-agente
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_MODEL=qwen2.5:14b
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - API_BASE_URL=http://host.docker.internal:8080
      - CASO_NEGOCIO=telecom
      - GRUPO=25
      - RAG_BASE_URL=http://34.71.149.196:8000/api/v1
      - RAG_EMAIL=grupo25_telecom@uniandes.edu.co
      - RAG_PASSWORD=telecom171
      - RAG_COLLECTION=telecom
      # Observabilidad (semana 3). Los valores se toman del .env local, que no
      # se versiona: la llave nunca queda escrita en este archivo.
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-misw4412-grupo25}
    volumes:
      # El subproceso del servidor MCP no hereda el entorno del servicio, así que
      # lee la URL de la API empresarial desde este archivo.
      - ./.env.docker:/app/.env:ro
      # SQLite del checkpointer (corto plazo) y del store (largo plazo). Sin este
      # volumen, `docker compose run --rm` borra el contenedor y con él los .sqlite.
      - agente-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  agente-data:
