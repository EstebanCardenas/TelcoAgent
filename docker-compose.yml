services:
  # API empresarial del curso: los sistemas internos de Telco Andina que el
  # agente consulta y contra los que registra contactos, tickets y telemetría.
  api:
    image: julianmora27/misw4412-api-empresarial:2026-20
    container_name: telco-api
    ports:
      # Publicado en el host para poder verificarla con
      # `curl localhost:8080/health` sin entrar al contenedor.
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agente2:
    build:
      context: .
      dockerfile: Dockerfile.agente2
    image: estebancardenas/telco-agente2:2026-20
    container_name: telco-agente2
    ports:
      - "8090:8090"
    environment:
      - AGENTE2_HOST=0.0.0.0
      - AGENTE2_PORT=8090
      - AGENTE2_DB_PATH=/app/data/retencion.sqlite
      - API_BASE_URL=http://api:8080
      - OLLAMA_MODEL=qwen2.5:14b
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-misw4412-grupo25}
    volumes:
      - agente2-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  agente:
    build:
      context: .
      dockerfile: Dockerfile
    image: estebancardenas/telco:2026-20
    container_name: telco-agente
    # El agente consulta la API desde el primer nodo del grafo, así que espera
    # a que responda el healthcheck en vez de arrancar contra un puerto muerto.
    depends_on:
      api:
        condition: service_healthy
      agente2:
        condition: service_healthy
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_MODEL=qwen2.5:14b
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # `api` es el nombre del servicio: Docker lo resuelve dentro de la red
      # del compose, sin pasar por el host.
      - API_BASE_URL=http://api:8080
      - AGENTE2_BASE_URL=http://agente2:8090
      - CASO_NEGOCIO=telecom
      - GRUPO=25
      - RAG_BASE_URL=http://34.71.149.196:8000/api/v1
      - RAG_EMAIL=grupo25_telecom@uniandes.edu.co
      - RAG_PASSWORD=telecom171
      - RAG_COLLECTION=telecom
      # Observabilidad (semana 3). Los valores se toman del .env local, que no
      # se versiona: la llave nunca queda escrita en este archivo.
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-misw4412-grupo25}
    volumes:
      # El subproceso del servidor MCP no hereda el entorno del servicio, así que
      # lee la URL de la API empresarial desde este archivo.
      - ./.env.docker:/app/.env:ro
      # SQLite del checkpointer (corto plazo) y del store (largo plazo). Sin este
      # volumen, `docker compose run --rm` borra el contenedor y con él los .sqlite.
      - agente-data:/app/data
    extra_hosts:
      # Solo para Ollama, que corre como servicio del host.
      - "host.docker.internal:host-gateway"

volumes:
  agente-data:
  agente2-data:
